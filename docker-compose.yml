
services:
  api-gateway:
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
    container_name: api-gateway
    ports:
      - "4000:4000"
    env_file:
      - ./api-gateway/.env
    depends_on:
      - auth-service
      - expense-service
      - fake-news-service
    restart: unless-stopped

  auth-service:
    build:
      context: ./services/auth-service
      dockerfile: Dockerfile
    container_name: auth-service
    env_file:
      - ./services/auth-service/.env
    expose:
      - "5003"
    restart: unless-stopped

  expense-service:
    build:
      context: ./services/expense-service
      dockerfile: Dockerfile
    container_name: expense-service
    env_file:
      - ./services/expense-service/.env
    expose:
      - "5001"
    restart: unless-stopped

  fake-news-service:
    build:
      context: ./services/fake-news-service
      dockerfile: Dockerfile
    container_name: fake-news-service
    env_file:
      - ./services/fake-news-service/.env
    expose:
      - "5002"
    restart: unless-stopped
  
  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    restart: unless-stopped
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: admin123
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  rabbitmq_data:
