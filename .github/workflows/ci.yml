name: Deploy Microservices

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Verify Deployment Trigger
        run: |
          echo "Deployment triggered!"
          echo "Branch: $GITHUB_REF_NAME"
          echo "Commit: $GITHUB_SHA"