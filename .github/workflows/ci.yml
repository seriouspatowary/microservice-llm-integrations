
name: CI Pipeline

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  test-runner:
    name: Test GitHub Hosted Runner
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Check Node.js
        run: node --version

      - name: Check npm
        run: npm --version

      - name: Check Docker
        run: docker --version

      - name: Check Docker Compose
        run: docker compose version

      - name: Runner successful
        run: echo "GitHub Hosted Runner is working!"
